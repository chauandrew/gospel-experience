<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0d" />
    <link rel="preconnect" href="https://script.google.com" crossorigin />
    <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin />
    <title>Sign up | The Gospel Experience</title>
  </head>
  <body>
    <main id="signup">
      <p class="eyebrow">The Gospel Experience</p>
      <h1>Sign up</h1>
      <p class="sub">Sign up individually or with your group</p>
      <div id="list" aria-live="polite"><p class="status"><span class="spin" aria-hidden="true"></span>Loading times...</p></div>
    </main>

    <dialog id="dlg" aria-labelledby="dTitle">
      <form id="form">
        <h2 id="dTitle"></h2>
        <p id="dSub" class="dim"></p>
        <label for="sizeOut">How many people are in your group?</label>
        <div class="step">
          <button type="button" id="minus" aria-label="Fewer people">&minus;</button>
          <output id="sizeOut" for="minus plus">1</output>
          <button type="button" id="plus" aria-label="More people">+</button>
          <span id="cap" class="dim"></span>
        </div>
        <label for="name">What is your name?</label>
        <input type="text" id="name" maxlength="80" autocomplete="name" placeholder="First and last name" />
        <p id="msg" class="msg" role="alert"></p>
        <div class="actions">
          <button type="button" id="cancel">Cancel</button>
          <button type="submit" id="ok" class="go">Sign up</button>
        </div>
      </form>
      <div id="done" hidden>
        <h2>You're signed up</h2>
        <p id="doneInfo"></p>
        <div class="actions"><button type="button" id="close" class="go">Done</button></div>
      </div>
    </dialog>

    <script type="module" src="/src/signup.js"></script>
  </body>
</html>
